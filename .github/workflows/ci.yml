name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: mil
          POSTGRES_PASSWORD: mil
          POSTGRES_DB: mil_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mil"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MIL_ENV: development
      MIL_LOG_LEVEL: WARNING
      MIL_DATABASE_URL: postgresql+asyncpg://mil:mil@localhost:5432/mil_test
      MIL_JWT_SECRET: ci-secret-that-is-at-least-32-characters-long
      MIL_CORS_ORIGINS: '["http://localhost:5173"]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('apps/api/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Ruff
        working-directory: apps/api
        run: ruff check src tests

      - name: Mypy
        working-directory: apps/api
        run: mypy src

      - name: Import layering
        working-directory: apps/api
        run: lint-imports

      - name: Migration safety (upgrade → downgrade → upgrade)
        working-directory: apps/api
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Schema drift check
        working-directory: apps/api
        run: alembic check

      - name: Tests
        working-directory: apps/api
        run: pytest -q

      - name: Docker build (api target)
        run: |
          docker build -f apps/api/Dockerfile --target api -t mil-api:ci apps/api

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @mil/web lint

      - name: Type check
        run: pnpm --filter @mil/web typecheck

      - name: Build
        run: pnpm --filter @mil/web build