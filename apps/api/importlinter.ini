[importlinter]
root_package = macro_api

[importlinter:contract:layers]
name = Layered architecture (routers → services → repositories → models)
type = layers
layers =
    macro_api.routers
    macro_api.services
    macro_api.repositories
    macro_api.models

[importlinter:contract:forbidden-fastapi]
name = Services and below must not import FastAPI or Starlette
type = forbidden
source_modules =
    macro_api.services
    macro_api.repositories
    macro_api.models
forbidden_modules =
    fastapi
    starlette